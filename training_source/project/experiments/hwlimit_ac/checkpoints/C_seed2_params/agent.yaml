seed: 2
num_steps_per_env: 32
max_iterations: 3001
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 50
experiment_name: hwlim_C
run_name: hwlim_C_seed2
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: false
load_run: .*
load_checkpoint: model_.*.pt
clip_actions: null
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 512
  - 256
  activation: elu
  obs_normalization: true
  init_noise_std: 0.7
  noise_std_type: scalar
  stochastic: true
  estimator_path: /home/ibrahim.alsarraj/Documents/Dexterous-In-Hand-Manipulation/training_source/project/experiments/scratch_state_estimation/models/estimator_B.pt
critic:
  hidden_dims: !!python/tuple
  - 512
  - 512
  - 256
  activation: elu
  obs_normalization: true
  init_noise_std: 0.7
  noise_std_type: scalar
  stochastic: false
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  action_transform: tanh
  rnd_cfg: null
  symmetry_cfg: null
multi_gpu: null
